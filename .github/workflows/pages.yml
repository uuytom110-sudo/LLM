name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, claude/hopeful-ptolemy-gvany5]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check data
        run: node scripts/check_data.js
      - name: Build site
        run: |
          python3 scripts/build_single.py
          mkdir -p _site
          cp -r index.html css js data _site/
          cp dist/gewu-offline.html _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
